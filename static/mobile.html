<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Civil News Hub 모바일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="./static/data_adapter.js?v=20261003_1327"></script>
<style>
/* Layout: one phone-width column (max 440px, centered on bigger screens) — large page title, list rows instead of cards, details in a bottom sheet, 5-tab bar fixed at the bottom */
:root{
  --out:#DCE3EA; --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EEF3; --ink:#0F2A44; --muted:#5B6C7E; --line:#D8E0E8;
  --accent:#D9480F; --accent-soft:#FFE8DB; --ok:#2B8A3E; --ok-soft:#E2F2E5; --scrim:rgba(5,15,25,.45); --shadow:0 1px 3px rgba(15,42,68,.14);
  --c-general:#5B6C7E; --c-road:#3F66A8; --c-water:#1F8585; --c-tunnel:#8B6440; --c-smart:#6A55C9;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  /* type scale: minor third (1.2) from a 16px phone base */
  --t-label:12px; --t-small:14px; --t-body:16px; --t-lead:18px; --t-h3:21px; --t-h2:26px; --t-h1:32px;
  --bar-h:52px; --tab-h:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --out:#060E17; --bg:#0A1521; --surface:#112131; --surface-2:#1A2F44; --ink:#E4ECF4; --muted:#93A5B8; --line:#233850;
  --accent:#FF7A2E; --accent-soft:#3A2012; --ok:#69DB7C; --ok-soft:#14301C; --scrim:rgba(0,0,0,.6); --shadow:0 1px 3px rgba(0,0,0,.5);
  --c-general:#9AABBD; --c-road:#7FA3E0; --c-water:#4FC2C2; --c-tunnel:#C99C70; --c-smart:#A794F0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --out:#060E17; --bg:#0A1521; --surface:#112131; --surface-2:#1A2F44; --ink:#E4ECF4; --muted:#93A5B8; --line:#233850;
  --accent:#FF7A2E; --accent-soft:#3A2012; --ok:#69DB7C; --ok-soft:#14301C; --scrim:rgba(0,0,0,.6); --shadow:0 1px 3px rgba(0,0,0,.5);
  --c-general:#9AABBD; --c-road:#7FA3E0; --c-water:#4FC2C2; --c-tunnel:#C99C70; --c-smart:#A794F0;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--out);color:var(--ink);font-family:var(--f-body);font-size:var(--t-body);line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums}

.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
@media (min-width:480px){.app{border-inline:1px solid var(--line)}}

/* top bar: small title fades in once the large title scrolls away */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:var(--bar-h);display:flex;align-items:center;padding:0 6px 0 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.bar-title{flex:1;font-size:var(--t-body);font-weight:700;opacity:0;transition:opacity .2s}
.bar.scrolled .bar-title{opacity:1}
.brand{font-family:var(--f-body);font-size:var(--t-small);font-weight:700;background:var(--ink);color:var(--bg);padding:3px 6px;border-radius:5px;margin-right:10px}
.ibtn{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center}
.ibtn svg{width:22px;height:22px}
.ibtn:active{background:var(--surface-2)}

.page-head{padding:4px 16px 18px}
.page-head h1{font-size:var(--t-h1);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:var(--t-small)}

.sec{margin-top:28px}
.sec:first-of-type{margin-top:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;padding:0 16px 8px;min-height:44px}
.sec-h h2{font-size:var(--t-lead);font-weight:700}
.sec-h small{font-size:var(--t-small);color:var(--muted);font-weight:500;margin-left:6px}
.more{border:0;background:none;color:var(--accent);font-size:var(--t-small);font-weight:600;min-height:44px;padding:0 0 0 12px}
.note{padding:0 16px 10px;margin:0;font-size:var(--t-small);color:var(--muted)}

/* list rows */
.list{background:var(--surface);border-block:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:14px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
button.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-meta{font-size:var(--t-small);color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center}
.row-title{font-size:var(--t-body);font-weight:600;line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row-sub{font-size:var(--t-small);color:var(--muted);margin-top:4px}
.row-sub.lede{display:-webkit-box;-webkit-line-clamp:var(--m-lede-lines,2);-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.row-sub b{color:var(--ink);font-weight:700}
.cat{color:var(--cat);font-weight:700}
.tagn{font-size:var(--t-small);font-weight:700;color:var(--ok);background:var(--ok-soft);padding:1px 7px;border-radius:5px}
.lv{font-size:var(--t-small);font-weight:700;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink)}

.dd{flex:none;width:54px;height:54px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dd b{font-family:var(--f-body);font-size:var(--t-h3)}
.dd span{font-size:var(--t-label);color:var(--muted);margin-top:4px}
.dd.soon{background:var(--accent-soft);color:var(--accent)}
.dd.soon span{color:var(--accent)}
.dd.hot{background:var(--accent);color:#fff}
.dd.hot span{color:#fff}
.dd.today b{font-family:var(--f-body);font-size:var(--t-body)}
.pd{flex:none;font-family:var(--f-body);font-size:var(--t-small);font-weight:700;padding:4px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted);align-self:center}
.pd.soon{background:var(--accent-soft);color:var(--accent)}
.pd.hot{background:var(--accent);color:#fff}
.logo{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:var(--t-lead)}
.income{flex:none;text-align:right;align-self:center}
.income b{display:block;font-family:var(--f-body);font-size:var(--t-lead);color:var(--ok)}
.income span{font-size:var(--t-small);color:var(--muted)}

/* filters */
.filters{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:var(--t-small);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:active{transform:scale(.97)}
.seg{margin:0 16px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg button{min-height:40px;border:0;background:none;border-radius:9px;font-size:var(--t-small);color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* home: swipeable deadline tiles */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:10px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.tile{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-height:154px}
.tile:active{background:var(--surface-2)}
.tile .k{font-size:var(--t-small);font-weight:700;color:var(--kind)}
.tile .n{font-family:var(--f-body);font-size:var(--t-h1);font-weight:700;line-height:1.1}
.tile .n small{font-family:var(--f-body);font-size:var(--t-small);font-weight:500;color:var(--muted);margin-left:3px}
.tile.hot .n{color:var(--accent)}
.tile .t{font-size:var(--t-small);font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{margin:0 16px;padding:18px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:var(--t-small);text-align:center}
.foot-note{padding:28px 16px 0;margin:0;font-size:var(--t-small);color:var(--muted)}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{height:var(--tab-h);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:var(--t-label);color:var(--muted)}
.tabbar svg{width:24px;height:24px}
.tabbar [aria-current="page"]{color:var(--ink);font-weight:700}
.tabbar [aria-current="page"] svg{color:var(--accent)}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:440px;max-height:90%;z-index:50;background:var(--surface);border-radius:20px 20px 0 0;transform:translate(-50%,100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:translate(-50%,0)}
.sheet-grab{touch-action:none}
.grip{display:flex;justify-content:center;padding:10px 0 2px}
.grip i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:0 6px 0 20px;font-size:var(--t-small);font-weight:700;color:var(--muted)}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 20px;display:flex;flex-direction:column;gap:18px}
.sheet-body h2{font-size:var(--t-h3);line-height:1.4}
.sheet-foot{display:flex;gap:10px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.btn{flex:1;min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:var(--t-body)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--surface-2)}
.btn.ghost[aria-pressed="true"]{color:var(--accent)}
.btn:active{opacity:.85}
.lede{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.lede-full{margin:0;font-size:var(--t-body);line-height:1.75}
.prize{font-family:var(--f-body);font-size:var(--t-h2);font-weight:700;letter-spacing:-.02em}
.prize small{font-family:var(--f-body);font-size:var(--t-small);color:var(--muted);font-weight:500;margin-left:6px}
.spec{margin:0;border-top:1px solid var(--line)}
.spec div{display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--t-body)}
.spec dt{color:var(--muted)}
.spec dd{margin:0;font-weight:500;min-width:0}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;align-items:center;gap:12px;padding:6px 0;font-size:var(--t-body);position:relative}
.steps li::before{content:counter(s);width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-body);font-size:var(--t-small);font-weight:700;background:var(--surface)}
.steps li.ncs::before{border-color:var(--accent);color:var(--accent)}
.steps li+li::after{content:"";position:absolute;left:13px;top:-8px;height:16px;width:2px;background:var(--line);z-index:-1}
.sub-h{font-size:var(--t-small);font-weight:700;color:var(--muted);margin-bottom:8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:var(--t-small);padding:5px 10px;border-radius:8px;background:var(--surface-2)}
.cluster{list-style:none;margin:0;padding:0}
.cluster li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--t-small)}
.cluster b{flex:none;width:96px;font-weight:600}
.cluster span{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* search */
.search{position:fixed;inset:0;z-index:45;max-width:440px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.search-top{display:flex;gap:4px;align-items:center;padding:8px 6px 8px 16px}
.field{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px;height:44px;color:var(--muted)}
.field svg{width:18px;height:18px;flex:none}
.field input{flex:1;border:0;background:none;font:inherit;font-size:var(--t-body);color:var(--ink);outline:none;min-width:0}
.cancel{border:0;background:none;min-height:44px;padding:0 10px;font-size:var(--t-body);color:var(--accent);font-weight:600}
.search-res{overflow-y:auto;flex:1;padding:8px 0 32px}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,16px);width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:var(--t-small);z-index:60;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){.sheet,.scrim,.toast,.bar,.bar-title{transition:none}}

/* typography: one family (Plex Sans KR); page titles and headline figures get weight 700 and size, not a second face */
body{word-break:keep-all;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;line-height:1.6}
h1,h2,h3{line-height:1.3;letter-spacing:-.01em}
.page-head h1,.dd b,.tile .n,.prize,.income b{font-weight:700;letter-spacing:-.01em}
.page-head h1{line-height:1.15}
.row-title,.sheet-body h2{line-height:1.45}
</style>

<div class="app">
  <header class="bar" id="bar">
    <span class="brand">CNH</span><span class="bar-title" id="bar-title">오늘</span>
    <button class="ibtn" id="open-search" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="ibtn" id="theme" aria-label="화면 테마 바꾸기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabbar" aria-label="하단 메뉴">
  <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11 12 4l9 7v9H3z"/></svg>오늘</button>
  <button data-go="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>뉴스</button>
  <button data-go="contest"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/></svg>공모전</button>
  <button data-go="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V4h6v3"/></svg>채용</button>
  <button data-go="jbnu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>전북대</button>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
  <div class="sheet-grab" id="grab">
    <div class="grip"><i></i></div>
    <div class="sheet-head"><span id="sh-kind"></span><button class="ibtn" id="sh-close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  </div>
  <div class="sheet-body" id="sh-body"></div>
  <div class="sheet-foot" id="sh-foot"></div>
</section>

<div class="search" id="search" hidden>
  <div class="search-top">
    <label class="field"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="뉴스, 공모전, 채용 찾기" aria-label="검색어" autocomplete="off"></label>
    <button class="cancel" id="close-search">취소</button>
  </div>
  <div class="search-res" id="search-res"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('ko-KR');
const today = new Date(); today.setHours(0,0,0,0);
const day = off => { const d = new Date(today); d.setDate(d.getDate()+off); return d; };
const DAY = ['일','월','화','수','목','금','토'];
const md = d => `${d.getMonth()+1}.${String(d.getDate()).padStart(2,'0')}(${DAY[d.getDay()]})`;
const urg = off => off <= 3 ? 'hot' : off <= 7 ? 'soon' : '';

/* ---------- 예시 데이터 ---------- */
let CATS = [{id:'general',name:'토목종합'},{id:'road',name:'도로·철도'},{id:'water',name:'수자원·항만'},{id:'tunnel',name:'터널·지반'},{id:'smart',name:'스마트건설'}];
const catName = id => CATS.find(c=>c.id===id).name;
let TRENDS = ['광역급행철도','스마트건설','지반침하','BIM 의무화','SOC 예산','신항만','TBM','중대재해'];
let NEWS = [
  {cat:'road',src:'인프라타임즈',ago:'32분 전',n:12,title:'수도권 광역급행철도 신규 노선 착공 본격화… 1공구 공정률 18% 돌파',

function monthly(a){
  if (a.type === 'day') return a.wage * a.days;
  const weekly = a.wage * a.hours + (a.hours >= 15 ? a.wage * a.hours / 5 : 0);
  return Math.round(weekly * 4.345 / 100) * 100;
}

function toggleSave(id){
  saved.has(id) ? saved.delete(id) : saved.add(id);
  try { localStorage.setItem('cnhm-saved', JSON.stringify([...saved])); } catch(e){}
  document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>{ b.setAttribute('aria-pressed', saved.has(id)); b.textContent = saved.has(id) ? '저장됨' : '저장'; });

  },
  jbnu(){
    return head('전북대', '전북대학교 학생을 위한 교내 알바와 SW 프로그램') + `
      <section class="sec"><div class="sec-h"><h2>캠퍼스 알바</h2></div>
        <p class="note">예상 수입은 주 15시간 이상이면 주휴수당을 넣어 한 달 4.345주로 계산했어요.</p>
        ${list([...ALBA].sort((a,b)=>a.end-b.end).map(albaRow).join(''))}</section>
      <section class="sec"><div class="sec-h"><h2>SW 중심대학사업단</h2></div>${list([...SW].sort((a,b)=>a.end-b.end).map(swRow).join(''))}</section>`;
  },
};

function render(toTop = true){
  $('#view').innerHTML = VIEWS[tab]();
  $('#bar-title').textContent = TITLES[tab];
  document.querySelectorAll('.tabbar [data-go]').forEach(b=> b.dataset.go===tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  if (toTop) window.scrollTo({top:0});
  onScroll();
  requestAnimationFrame(() => { fitMobileNewsLines(); requestAnimationFrame(fitMobileNewsLines); });
}
function fitMobileNewsLines(){
  document.querySelectorAll('#view .row').forEach(r => {
    const t = r.querySelector('.row-title'), lede = r.querySelector('.row-sub.lede');
    if (!t || !lede) return;
    const h = t.getBoundingClientRect().height || t.offsetHeight || 0;
    if (h <= 0) return;
    const style = getComputedStyle(t);
    let lh = parseFloat(style.lineHeight);
    if (isNaN(lh) || lh <= 0) lh = (parseFloat(style.fontSize) || 15) * 1.45;
    const lines = Math.min(2, Math.max(1, Math.round(h / lh)));
    lede.style.setProperty('--m-lede-lines', Math.max(1, 4 - lines));
  });
}
function go(t){
  if (!VIEWS[t]) t = 'home';
  tab = t;
  if (location.hash.slice(1) !== t) history.replaceState(null,'','#'+t);
  render();
}
function rerender(){ const y = scrollY; render(false); window.scrollTo({top:y}); }

/* ---------- 바텀시트 ---------- */
let lastFocus = null;
function openSheet(key){
  const [type,id] = key.split(':');
  let kind = '', body = '', foot = '';
  const dummy = '<button class="btn primary" data-dummy>LABEL</button>';
  if (type==='n'){
    const n = NEWS[+id];
    kind = catName(n.cat);
    const clusterHtml = (n.clusters && n.clusters.length)
      ? n.clusters.map(c => `<li><a href="${c.link || '#'}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;width:100%;border-bottom:1px solid var(--line)"><b style="flex:none;font-weight:600">${c.publisher} ↗</b><span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-small)">${c.title}</span></a></li>`).join('')
      : Array.from({length:n.n},(_,k)=>`<li><div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)"><b style="flex:none;width:96px;font-weight:600">${OTHER_SRC[(+id+k)%OTHER_SRC.length]}</b><span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-small)">${n.title}</span></div></li>`).join('');

    body = `<div><div class="row-meta"><span>${n.src}</span><span>${n.ago}</span></div><h2 id="sh-title" style="margin-top:6px">${n.title}</h2></div>
      <p class="lede-full">${n.lede}</p>
      ${n.n > 0 ? `<div><div class="sub-h" style="font-weight:700;margin:16px 0 8px">같은 보도자료로 쓴 기사 ${n.n}건</div><ul class="cluster" style="list-style:none;padding:0;margin:0">${clusterHtml}</ul></div>` : ''}`;
    foot = `<a href="${n.link || '#'}" target="_blank" rel="noopener noreferrer" class="btn primary" style="text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;width:100%">원문 기사 보기 ↗</a>`;
  } else if (type==='c'){
    const c = CONTESTS.find(x=>x.id===id);
    kind = '공모전';
    body = `<div style="display:flex;gap:14px;align-items:center">${ddBox(c.end)}<h2 id="sh-title">${c.title}</h2></div>
      <div class="prize">${fmt(c.prize)}만원<small>총 상금</small></div>
      <dl class="spec">
        <div><dt>주최</dt><dd>${c.org}</dd></div>
        <div><dt>훈격</dt><dd>${c.award}</dd></div>
        <div><dt>참가 대상</dt><dd>${c.target.join(', ')}</dd></div>
        <div><dt>접수 기간</dt><dd class="num">${md(day(c.start))} ~ ${md(day(c.end))}</dd></div>
        <div><dt>시상</dt><dd>대상 1팀, 최우수 2팀, 우수 3팀, 장려 5팀</dd></div>
        <div><dt>제출물</dt><dd>기획서(PDF, 10쪽 이내), 발표 영상 3분</dd></div>
      </dl>`;
    foot = `<button class="btn ghost" data-save="${c.id}" aria-pressed="${saved.has(c.id)}">${saved.has(c.id)?'저장됨':'저장'}</button><a href="${c.link || '#'}" target="_blank" rel="noopener noreferrer" class="btn" style="text-decoration:none;display:grid;place-items:center">공식 접수처 바로가기 ↗</a>`;
  } else {
    const j = JOBS.find(x=>x.id===id);
    kind = GRP[j.grp] + ' 채용';
    body = `<div style="display:flex;gap:14px;align-items:center"><div class="logo" style="background:${j.color}">${j.co[0]}</div><div><div class="row-meta"><span>${j.co}</span></div><h2 id="sh-title">${j.role}</h2></div></div>
      <dl class="spec">
        <div><dt>지원 자격</dt><dd>${j.lvl}${j.exp?' ('+j.exp+')':''}, 토목 관련 전공</dd></div>
        <div><dt>근무지</dt><dd>${j.loc}</dd></div>
        <div><dt>마감</dt><dd><span class="num">${md(day(j.end))} 18:00</span> ${ddPill(j.end)}</dd></div>
        <div><dt>우대</dt><dd>토목기사, 건설안전기사, BIM 활용 경험</dd></div>
      </dl>
      <div><div class="sub-h">전형 절차</div><ol class="steps">${j.steps.map(s=>`<li class="${s==='NCS'?'ncs':''}">${s}</li>`).join('')}</ol></div>
      <div><div class="sub-h">복리후생</div><div class="pills">${j.welfare.map(w=>`<span class="pill">${w}</span>`).join('')}</div></div>`;
    foot = `<button class="btn ghost" data-save="${j.id}" aria-pressed="${saved.has(j.id)}">${saved.has(j.id)?'저장됨':'저장'}</button><a href="${j.link || '#'}" target="_blank" rel="noopener noreferrer" class="btn" style="text-decoration:none;display:grid;place-items:center">채용 공고 지원하기 ↗</a>`;
  }
  $('#sh-kind').textContent = kind; $('#sh-body').innerHTML = body; $('#sh-foot').innerHTML = foot;
  $('#sh-body').scrollTop = 0;
  lastFocus = document.activeElement;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  $('#sh-close').focus({preventScroll:true});
}
function closeSheet(){
  const s = $('#sheet'); s.style.transform = ''; s.classList.remove('on'); $('#scrim').classList.remove('on');
  lastFocus && lastFocus.focus && lastFocus.focus({preventScroll:true});
}
// 손잡이를 아래로 끌어 닫기
let y0 = null;
$('#grab').addEventListener('touchstart', e=>{ y0 = e.touches[0].clientY; $('#sheet').style.transition = 'none'; }, {passive:true});
$('#grab').addEventListener('touchmove', e=>{ if (y0===null) return; const dy = Math.max(0, e.touches[0].clientY - y0); $('#sheet').style.transform = `translate(-50%,${dy}px)`; }, {passive:true});
$('#grab').addEventListener('touchend', e=>{
  if (y0===null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
  const s = $('#sheet'); s.style.transition = '';
  if (dy > 90) closeSheet(); else s.style.transform = '';
});

/* ---------- 검색 ---------- */
function openSearch(q = ''){
  $('#search').hidden = false; $('#q').value = q; runSearch(); $('#q').focus();
  document.body.style.overflow = 'hidden';
}
function closeSearch(){ $('#search').hidden = true; document.body.style.overflow = ''; }
function runSearch(){
  const q = $('#q').value.trim().toLowerCase();
  const el = $('#search-res');
  if (!q){
    el.innerHTML = `<div class="sec-h"><h2>많이 찾는 키워드</h2></div><div class="chips wrap">${TRENDS.map(t=>`<button class="chip" data-q="${t}">#${t}</button>`).join('')}</div>`;
    return;
  }
  const has = s => s.toLowerCase().includes(q);
  const groups = [
    ['뉴스', NEWS.map((n,i)=>[n,i]).filter(([n])=>has(n.title)||has(n.lede)).map(([n,i])=>newsRow(n,i))],
    ['공모전', CONTESTS.filter(c=>has(c.title)||has(c.org)).map(contestRow)],
    ['채용', JOBS.filter(j=>has(j.co)||has(j.role)).map(jobRow)],
    ['전북대 알바', ALBA.filter(a=>has(a.title)||has(a.where)).map(albaRow)],
  ].filter(g=>g[1].length);
  el.innerHTML = groups.length
    ? groups.map(([t,rows])=>`<section class="sec"><div class="sec-h"><h2>${t}<small>${rows.length}</small></h2></div>${list(rows.join(''))}</section>`).join('')
    : `<p class="empty" style="margin-top:12px">'${$('#q').value.trim()}'와 맞는 항목이 없어요. 더 짧은 단어로 찾아 보세요.</p>`;
}
$('#q').addEventListener('input', runSearch);

/* ---------- 이벤트 ---------- */
let tt;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('on'), 2400); }

document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.save) return toggleSave(d.save);
  if ('dummy' in d) return toast('예시 데이터라서 실제 페이지로 연결되지 않아요.');
  if (d.open) return openSheet(d.open);
  if (d.go){ closeSearch(); return go(d.go); }
  if (d.q) return openSearch(d.q);
  if (d.cat){ newsCat = d.cat; return rerender(); }
  if (d.tg){ target = d.tg; return rerender(); }
  if (d.sort){ sortBy = d.sort; return rerender(); }
  if (d.grp){ jobGrp = d.grp; return rerender(); }
  if (d.lvl){ lvl = d.lvl; return rerender(); }
});
$('#scrim').onclick = closeSheet;
$('#sh-close').onclick = closeSheet;
$('#open-search').onclick = () => openSearch();
$('#close-search').onclick = closeSearch;
document.addEventListener('keydown', e=>{
  if (e.key !== 'Escape') return;
  if ($('#sheet').classList.contains('on')) closeSheet(); else if (!$('#search').hidden) closeSearch();
});
function onScroll(){ $('#bar').classList.toggle('scrolled', scrollY > 44); }
addEventListener('scroll', onScroll, {passive:true});

$('#theme').onclick = ()=>{
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('cnhm-theme', r.dataset.theme); } catch(e){}
};
try { const th = localStorage.getItem('cnhm-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}

go(location.hash.slice(1) || 'home');

/* ---------- 모바일 실시간 크롤링 데이터 연동 엔진 ---------- */
async function syncMobileStandaloneLiveData(){
  if (typeof CivilData === 'undefined') return;
  try {
    const live = await CivilData.loadAll();
    if (live) {
      if (live.TRENDS && live.TRENDS.length) TRENDS = live.TRENDS.map(t=>t[0]);
      if (live.NEWS && live.NEWS.length) NEWS = live.NEWS;
      if (live.CONTESTS && live.CONTESTS.length) CONTESTS = live.CONTESTS;
      if (live.JOBS && live.JOBS.length) JOBS = live.JOBS;
      if (live.ALBA && live.ALBA.length) ALBA = live.ALBA;
      if (live.SW && live.SW.length) SW = live.SW;

      if (typeof rerender === 'function') rerender();
      else if (typeof render === 'function') render(false);

      const mNotEl = document.getElementById('m-live-notice');
      if (mNotEl && live.meta) {
        mNotEl.innerHTML = `🟢 <b>실시간 크롤링 데이터</b> (뉴스 ${live.meta.newsCount}건, 채용 ${live.meta.jobsCount}건, 공모전 ${live.meta.contestsCount}건, 알바 ${live.meta.albaCount}건 · 업데이트: ${live.meta.lastUpdated})`;
      }
    }
  } catch(e) {
    console.warn('Mobile standalone live sync error:', e);
  }
}
syncMobileStandaloneLiveData();

</script>
