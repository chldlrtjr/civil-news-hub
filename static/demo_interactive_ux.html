<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 신개념 인터랙션 4종 실시간 체험 데모</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, Roboto, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .snap-y-mandatory { scroll-snap-type: y mandatory; }
    .snap-start-card { scroll-snap-align: start; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 p-3 sm:p-6 flex flex-col items-center justify-center min-h-screen">

  <!-- 컨트롤 가이드 바 -->
  <div class="max-w-md w-full mb-3 text-center">
    <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-blue-500/20 text-blue-300 rounded-full text-xs font-semibold border border-blue-400/30 mb-2">
      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> 4가지 신개념 인터랙션 인터랙티브 체험
    </div>
    <p class="text-xs text-slate-400">아래 4개 버튼을 눌러 모바일 화면 안에서 직접 조작(스크롤/스와이프/탭)해 보세요.</p>
  </div>

  <!-- 스마트폰 프레임 -->
  <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl border-4 border-slate-700 overflow-hidden flex flex-col h-[780px] relative">
    
    <!-- 스마트폰 상단 노치 & 헤더 -->
    <div class="bg-slate-950 text-white px-5 pt-3 pb-2.5 z-20 flex-shrink-0">
      <div class="flex justify-between items-center text-[11px] text-slate-400 mb-2">
        <span class="font-bold">09:41</span>
        <div class="w-20 h-4 bg-slate-800 rounded-full mx-auto"></div>
        <div class="flex items-center gap-1.5">
          <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
          <i data-lucide="battery" class="w-3.5 h-3.5"></i>
        </div>
      </div>
      <div class="flex items-center justify-between">
        <h1 class="font-extrabold text-sm flex items-center gap-1.5 text-white">
          <i data-lucide="compass" class="w-4 h-4 text-blue-400"></i>
          토목 뉴스 큐레이션
        </h1>
        <span id="currentModeBadge" class="text-[11px] font-bold text-amber-300 bg-amber-950/80 px-2 py-0.5 rounded-full border border-amber-600/40">
          1. 넷플릭스 가로슬라이더
        </span>
      </div>
    </div>

    <!-- 4대 인터랙션 선택 스위처 (모바일 탭 바) -->
    <div class="bg-slate-100 border-b border-slate-200 p-2 z-10 flex-shrink-0">
      <div class="grid grid-cols-4 gap-1 text-[11px] font-bold text-center">
        <button id="navBtn-slider" onclick="setDemoMode('slider')" class="py-2 rounded-xl bg-blue-600 text-white shadow-xs transition flex flex-col items-center">
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5 mb-0.5"></i>
          <span>가로슬라이더</span>
        </button>
        <button id="navBtn-accordion" onclick="setDemoMode('accordion')" class="py-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 shadow-xs transition flex flex-col items-center">
          <i data-lucide="chevron-down-square" class="w-3.5 h-3.5 mb-0.5"></i>
          <span>아코디언</span>
        </button>
        <button id="navBtn-snap" onclick="setDemoMode('snap')" class="py-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 shadow-xs transition flex flex-col items-center">
          <i data-lucide="layers" class="w-3.5 h-3.5 mb-0.5"></i>
          <span>스냅카드</span>
        </button>
        <button id="navBtn-isolated" onclick="setDemoMode('isolated')" class="py-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 shadow-xs transition flex flex-col items-center">
          <i data-lucide="layout" class="w-3.5 h-3.5 mb-0.5"></i>
          <span>독립탭</span>
        </button>
      </div>
    </div>

    <!-- 모드 설명 툴팁 바 -->
    <div id="modeDescBar" class="bg-blue-50/80 px-3.5 py-1.5 text-[11px] text-blue-700 border-b border-blue-100 flex items-center justify-between flex-shrink-0">
      <span class="truncate">👉 <b>가로로 좌우 스와이프</b>하여 분야별 기사를 넘겨보세요.</span>
      <span class="text-[10px] text-blue-500 font-semibold flex-shrink-0">세로 스크롤 대폭 감소</span>
    </div>

    <!-- 메인 뷰포트 (동적 인터랙션 컨테이너) -->
    <div id="viewportContainer" class="flex-1 overflow-hidden relative bg-slate-50 flex flex-col">
      <!-- 동적 렌더링 영역 -->
    </div>

  </div>

  <script>
    // 가상 데이터
    const categoryData = [
      {
        id: 'road_rail',
        name: '도로·철도',
        icon: 'train',
        color: 'blue',
        articles: [
          { title: 'GTX-B 재정구간 조기 착공 돌입… 수도권 30분대 출퇴근', snippet: '인천 송도에서 서울 여의도, 마석까지 잇는 광역급행철도가 본격 시공에 돌입합니다.', pub: '대한경제', time: '12분 전' },
          { title: '코레일, 철도 궤도 이상 유무 AI 24시간 실시간 감시망 가동', snippet: '선로 이상 징후를 사전에 포착하는 차세대 지능형 열차 자율진단 시스템 도입.', pub: '철도신문', time: '40분 전' },
          { title: '호남고속철도 2단계 턴키 공사 70% 돌입… 2027년 개통 순항', snippet: '나주~무안공항~목포를 잇는 고속철도 노선 구축이 급물살을 타고 있습니다.', pub: '연합뉴스', time: '2시간 전' }
        ]
      },
      {
        id: 'smart_tech',
        name: '스마트건설',
        icon: 'cpu',
        color: 'emerald',
        articles: [
          { title: '도로공사, 고속도로 현장에 원격 스마트 로봇 시공 전면 도입', snippet: '위험 교량 하부 및 급경사면에 자율주행 건설 로봇을 투입하여 안전사고 제로화.', pub: '건설타임즈', time: '35분 전' },
          { title: '국토부, 공공 건설공사 BIM 설계 및 디지털 트윈 의무화 가속', snippet: '설계 오차를 mm 단위로 정밀 제어하는 BIM 표준 프레임워크가 전면 고시되었습니다.', pub: '매일건설신문', time: '1시간 전' },
          { title: '현대건설, 세계 최초 무인 자율 굴착기 현장 실증 테스트 성공', snippet: '오차 2cm 이내 정밀 토공 작업을 원격 중앙관제실에서 무인으로 수행 완료.', pub: '조선비즈', time: '3시간 전' }
        ]
      },
      {
        id: 'water_port',
        name: '수자원·항만',
        icon: 'droplets',
        color: 'cyan',
        articles: [
          { title: 'K-water, AI 기반 극한 호우 댐 홍수 방어망 실시간 가동', snippet: '기상 레이더와 인공지능을 결합하여 유입량을 3시간 전 정밀 예측하는 방어망 구축.', pub: '한국수자원공보', time: '1시간 전' },
          { title: '부산·경남 광역상수도 노후관 개량 현대화 국비 1,200억 투입', snippet: '누수 방지와 가뭄 대응을 위한 지하 대형 송수관로 전면 개량 사업 착공.', pub: '동아일보', time: '3시간 전' }
        ]
      },
      {
        id: 'underground',
        name: '지하안전',
        icon: 'shield-check',
        color: 'amber',
        articles: [
          { title: '서울시, 지반침하(싱크홀) 고위험 50개 구간 GPR 전수 정밀 탐사', snippet: '지표투과레이더(GPR) 탐사 장비를 총동원하여 도로 하부 공동을 선제 복구합니다.', pub: '한국경제', time: '2시간 전' },
          { title: '지하안전관리 특별법 개정안 통과… 10m 이상 굴착 계측 강화', snippet: '지반안전평가 점검 주기를 2배 단축하고 스마트 계측기기 설치를 의무화합니다.', pub: '정책브리핑', time: '4시간 전' }
        ]
      }
    ];

    let currentMode = 'slider';
    let isolatedActiveCat = 'road_rail';
    let openAccordionId = 'road_rail';

    function setDemoMode(mode) {
      currentMode = mode;

      // 버튼 스타일 업데이트
      ['slider', 'accordion', 'snap', 'isolated'].forEach(m => {
        const btn = document.getElementById(`navBtn-${m}`);
        if (m === mode) {
          btn.className = 'py-2 rounded-xl bg-blue-600 text-white shadow-xs transition flex flex-col items-center';
        } else {
          btn.className = 'py-2 rounded-xl bg-white text-slate-600 hover:text-slate-900 shadow-xs transition flex flex-col items-center';
        }
      });

      const badge = document.getElementById('currentModeBadge');
      const desc = document.getElementById('modeDescBar');

      if (mode === 'slider') {
        badge.textContent = '1. 넷플릭스 가로슬라이더';
        desc.innerHTML = '<span class="truncate">👉 <b>가로로 좌우 스와이프</b>하여 기사를 넘겨보세요.</span><span class="text-[10px] text-blue-500 font-semibold flex-shrink-0">세로 길이 80% 압축</span>';
        renderSliderView();
      } else if (mode === 'accordion') {
        badge.textContent = '2. 아코디언 대시보드';
        desc.innerHTML = '<span class="truncate">👉 <b>원하는 분야를 탭</b>하면 아래로 스르륵 펼쳐집니다.</span><span class="text-[10px] text-emerald-600 font-semibold flex-shrink-0">스크롤 필요 제로</span>';
        renderAccordionView();
      } else if (mode === 'snap') {
        badge.textContent = '3. 쇼츠/카드 스냅';
        desc.innerHTML = '<span class="truncate">👉 <b>위아래로 슥 튕겨보세요.</b> 1장씩 착착 달라붙습니다.</span><span class="text-[10px] text-amber-600 font-semibold flex-shrink-0">끝없는 스크롤 제로</span>';
        renderSnapView();
      } else if (mode === 'isolated') {
        badge.textContent = '4. 순수 독립 탭 모드';
        desc.innerHTML = '<span class="truncate">👉 상단 탭을 눌러 <b>선택한 1개 카테고리만 깔끔하게</b> 봅니다.</span><span class="text-[10px] text-indigo-600 font-semibold flex-shrink-0">전체 나열 폐지</span>';
        renderIsolatedView();
      }

      lucide.createIcons();
    }

    // 1. 넷플릭스 가로 슬라이더 렌더링
    function renderSliderView() {
      const vp = document.getElementById('viewportContainer');
      let html = `<div class="flex-1 overflow-y-auto p-4 space-y-5 custom-scroll">`;

      categoryData.forEach(cat => {
        html += `
          <div>
            <div class="flex items-center justify-between mb-2 px-1">
              <h2 class="font-extrabold text-sm text-slate-900 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                ${cat.name}
                <span class="text-[11px] font-normal text-slate-400">(${cat.articles.length}건)</span>
              </h2>
              <span class="text-[11px] text-blue-600 font-semibold flex items-center">더보기 <i data-lucide="chevron-right" class="w-3 h-3"></i></span>
            </div>
            
            <!-- 가로 스와이프 슬라이더 -->
            <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-1 px-1 snap-x">
              ${cat.articles.map(art => `
                <div class="snap-start flex-shrink-0 w-[240px] bg-white rounded-2xl p-3.5 border border-slate-200/90 shadow-xs flex flex-col justify-between">
                  <div>
                    <span class="text-[10px] text-slate-400 font-medium mb-1 block">${art.pub} · ${art.time}</span>
                    <h3 class="font-bold text-xs text-slate-900 line-clamp-2 leading-snug mb-1.5">${art.title}</h3>
                    <p class="text-[11px] text-slate-500 line-clamp-2 leading-relaxed">${art.snippet}</p>
                  </div>
                  <div class="pt-2 mt-2 border-t border-slate-100 flex justify-between items-center text-[10px] text-slate-400">
                    <span class="text-blue-600 font-semibold">요약 읽기</span>
                    <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      html += `</div>`;
      vp.innerHTML = html;
    }

    // 2. 아코디언 대시보드 렌더링
    function renderAccordionView() {
      const vp = document.getElementById('viewportContainer');
      let html = `<div class="flex-1 overflow-y-auto p-3.5 space-y-2.5 custom-scroll">`;

      categoryData.forEach(cat => {
        const isOpen = (cat.id === openAccordionId);
        html += `
          <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs transition-all">
            <!-- 아코디언 헤더 바 (1줄 요약) -->
            <div onclick="toggleAccordion('${cat.id}')" class="p-3.5 cursor-pointer flex items-center justify-between bg-slate-50/80 hover:bg-slate-100 transition select-none">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-6 h-6 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold flex-shrink-0">
                  <i data-lucide="${cat.icon}" class="w-3.5 h-3.5"></i>
                </span>
                <span class="font-bold text-xs text-slate-900">${cat.name}</span>
                <span class="text-[11px] text-slate-500 truncate font-normal">"${cat.articles[0].title.slice(0, 18)}..."</span>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0 text-slate-400">
                <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200">${cat.articles.length}건</span>
                <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200 ${isOpen ? 'rotate-180 text-blue-600' : ''}"></i>
              </div>
            </div>

            <!-- 펼쳐지는 기사 목록 -->
            ${isOpen ? `
              <div class="p-3 space-y-2.5 border-t border-slate-100 bg-white">
                ${cat.articles.map(art => `
                  <div class="p-2.5 rounded-xl bg-slate-50 hover:bg-blue-50/50 border border-slate-100 transition">
                    <div class="text-[10px] text-slate-400 mb-0.5">${art.pub} · ${art.time}</div>
                    <h4 class="font-bold text-xs text-slate-800 line-clamp-1 mb-1">${art.title}</h4>
                    <p class="text-[11px] text-slate-600 line-clamp-2 leading-relaxed">${art.snippet}</p>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      });

      html += `</div>`;
      vp.innerHTML = html;
    }

    function toggleAccordion(catId) {
      openAccordionId = (openAccordionId === catId) ? null : catId;
      renderAccordionView();
      lucide.createIcons();
    }

    // 3. 쇼츠/카드 스냅 렌더링
    function renderSnapView() {
      const vp = document.getElementById('viewportContainer');
      const allFlat = [];
      categoryData.forEach(cat => {
        cat.articles.forEach(art => {
          allFlat.push({ ...art, catName: cat.name, icon: cat.icon });
        });
      });

      let html = `
        <div class="flex-1 overflow-y-auto snap-y-mandatory custom-scroll relative">
          ${allFlat.map((art, idx) => `
            <div class="snap-start-card h-full w-full p-4 flex flex-col justify-between bg-white border-b border-slate-100">
              <div>
                <div class="flex items-center justify-between text-xs mb-3">
                  <span class="px-2.5 py-1 rounded-lg text-xs font-bold text-blue-700 bg-blue-50 border border-blue-200 flex items-center gap-1">
                    <i data-lucide="${art.icon}" class="w-3 h-3"></i> ${art.catName}
                  </span>
                  <span class="text-xs font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full">${idx + 1} / ${allFlat.length}</span>
                </div>

                <span class="text-xs text-slate-400 block mb-2">${art.pub} · ${art.time}</span>
                <h3 class="font-extrabold text-base text-slate-900 leading-snug mb-3">${art.title}</h3>

                <!-- 3줄 핵심 AI 요약 박스 -->
                <div class="bg-blue-50/60 rounded-2xl p-3.5 border border-blue-100 space-y-2 mb-4">
                  <div class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></span>
                    <span>${art.snippet}</span>
                  </div>
                  <div class="flex items-start gap-2 text-xs text-slate-700 leading-relaxed">
                    <span class="w-1.5 h-1.5 rounded-full bg-blue-500 mt-1.5 flex-shrink-0"></span>
                    <span>상반기 조기 예산 투입 및 현장 점검 완료.</span>
                  </div>
                </div>
              </div>

              <!-- 하단 액션 버튼 -->
              <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                <button class="px-4 py-2 rounded-xl bg-blue-600 text-white font-bold flex items-center gap-1.5 shadow-xs">
                  <span>원문 기사 보기</span>
                  <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                </button>
                <div class="flex items-center gap-2 text-slate-400">
                  <button class="p-2 rounded-xl hover:bg-slate-100"><i data-lucide="share-2" class="w-4 h-4"></i></button>
                  <button class="p-2 rounded-xl hover:bg-slate-100"><i data-lucide="bookmark" class="w-4 h-4"></i></button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      vp.innerHTML = html;
    }

    // 4. 순수 독립 탭 렌더링
    function renderIsolatedView() {
      const vp = document.getElementById('viewportContainer');
      const curCat = categoryData.find(c => c.id === isolatedActiveCat) || categoryData[0];

      let html = `
        <div class="bg-white border-b border-slate-200 px-3 py-1.5 flex gap-2 overflow-x-auto hide-scrollbar flex-shrink-0">
          ${categoryData.map(c => `
            <button onclick="setIsolatedCat('${c.id}')" class="px-3 py-1.5 text-xs font-bold rounded-lg whitespace-nowrap transition ${
              c.id === isolatedActiveCat 
                ? 'bg-blue-600 text-white shadow-xs' 
                : 'text-slate-500 hover:text-slate-800 bg-slate-100'
            }">
              ${c.name} (${c.articles.length})
            </button>
          `).join('')}
        </div>

        <div class="flex-1 overflow-y-auto p-3.5 space-y-3 custom-scroll">
          <div class="flex justify-between items-center text-xs text-slate-500 px-1">
            <span class="font-bold text-slate-800">${curCat.name} 기사 모음</span>
            <span>총 ${curCat.articles.length}건</span>
          </div>

          ${curCat.articles.map(art => `
            <div class="bg-white rounded-2xl p-3.5 border border-slate-200 shadow-xs">
              <span class="text-[11px] text-slate-400 mb-1 block">${art.pub} · ${art.time}</span>
              <h3 class="font-bold text-xs text-slate-900 leading-snug mb-1.5">${art.title}</h3>
              <p class="text-[11px] text-slate-600 leading-relaxed mb-2">${art.snippet}</p>
              <div class="pt-2 border-t border-slate-100 flex justify-end gap-2 text-slate-400">
                <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
                <i data-lucide="bookmark" class="w-3.5 h-3.5"></i>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      vp.innerHTML = html;
    }

    function setIsolatedCat(catId) {
      isolatedActiveCat = catId;
      renderIsolatedView();
      lucide.createIcons();
    }

    // 초기 실행
    setDemoMode('slider');
  </script>
</body>
</html>
