name: 토목 뉴스, 공모전, 채용, 알바 및 SW사업단 정기 자동 수집 및 배포 (07, 11, 15, 19, 23시)

on:
  schedule:
    # 매일 한국 시간 07:00, 11:00, 15:00, 19:00, 23:00 (UTC 22:00, 02:00, 06:00, 10:00, 14:00) 자동 실행
    - cron: '0 2,6,10,14,22 * * *'
  workflow_dispatch: # GitHub 웹에서 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 전체 데이터 크롤링 및 무결성 검증 실행
        run: |
          python scraper.py
          python contest_scraper.py
          python job_scraper.py
          python jbnu_scraper.py
          python swuniv_scraper.py
          python test_contests_integrity.py

      - name: 업데이트된 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/contests.json data/jobs.json data/jbnu_albas.json data/swuniv_programs.json static/data/swuniv_programs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: [자동 수집] $(date '+%Y-%m-%d %H:%M') 토목 뉴스, 공모전, 채용, 알바 및 SW사업단 데이터 업데이트" && git push)
