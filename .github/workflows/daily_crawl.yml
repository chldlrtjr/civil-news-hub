name: 비상 수집 (jcloud가 멈췄을 때만)

# 평소 수집은 jcloud cron이 매시 해요. 예약 없이, 수집 감시(watchdog.yml)가
# 번들이 3시간 넘게 안 바뀐 걸 보면 이 워크플로를 실행해요. 손으로 실행해도 돼요.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -q -r requirements.txt

      # 포스터 OCR·위비티·전북대 상세·뉴스 원문 요약 캐시는 git에 없어서 실행 사이에 Actions 캐시로 이어 써요 (없으면 Gemini 한도를 다시 씀)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            data/poster_ocr_cache.json
            data/wevity_detail_cache.json
            data/jbnu_detail_cache.json
            data/news_meta_cache.json
          key: crawl-cache-${{ github.run_id }}
          restore-keys: crawl-cache-

      - name: 수집 (한 수집기가 실패해도 나머지는 계속) + 무결성 검증
        env:
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
          JOBALIO_API_KEY: ${{ secrets.JOBALIO_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for s in scraper.py contest_scraper.py job_scraper.py jbnu_scraper.py swuniv_scraper.py build_data_bundle.py; do
            python "$s" || echo "::warning::$s 실패"
          done
          # 무결성 검사에 걸리면 공모전만 지난 회차로 되돌려 번들을 다시 만들고 나머지는 올려요 (jcloud cron_scrape.sh 와 같은 규칙)
          if ! python test_contests_integrity.py; then
            echo "::warning::공모전 무결성 검사 실패 — 공모전은 지난 회차 그대로"
            git checkout HEAD -- data/contests.json
            python build_data_bundle.py || git checkout HEAD -- static/cnh_data_bundle.js
          fi

      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/contests.json data/jobs.json data/work24_cache.json data/jbnu_albas.json data/swuniv_programs.json static/cnh_data_bundle.js
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -q -m "chore: [비상 수집] $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') jcloud 대신 Actions에서 수집"
          git pull -q --rebase origin main  # 그 사이 jcloud가 살아나 푸시했으면 충돌로 멈춤(데이터 손상 없음)
          git push -q origin main
