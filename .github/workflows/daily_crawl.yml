name: 매일 아침 토목 뉴스 자동 수집 및 배포

on:
  schedule:
    # 매일 한국 시간 아침 7시 (UTC 22:00) 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub 웹에서 수동 실행 가능

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 토목 뉴스 및 공모전 크롤링 실행
        run: |
          python scraper.py

      - name: 업데이트된 뉴스 및 공모전 데이터 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/contests.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: [자동 수집] $(date '+%Y-%m-%d %H:%M') 토목 뉴스 및 공모전 업데이트" && git push)
