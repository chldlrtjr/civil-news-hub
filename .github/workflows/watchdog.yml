name: jcloud 수집 감시

# jcloud가 매시 커밋하는 번들이 3시간 넘게 멈추면 텔레그램으로 알리고 Actions 비상 수집을 돌려요.
on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # 비상 수집 워크플로 실행용

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 마지막 데이터 갱신 확인
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=static/cnh_data_bundle.js&per_page=1" --jq '.[0].commit.committer.date')
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 3600 ))
          echo "마지막 데이터 갱신: $last (${age}시간 전)"
          # 매시 예약이 실제로는 5~7시간 간격으로 돌아서(11-20~23 실측) 멈춘 걸 볼 때마다 알려요
          if [ "$age" -ge 3 ]; then
            curl -sS -m 20 "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
              --data-urlencode "text=⚠️ [Civil News Hub] jcloud 수집이 ${age}시간째 멈춰 있어요 (마지막: $last). Actions 비상 수집을 돌릴게요" > /dev/null
            echo "알림 발송"
          fi
          # 비상 수집이 성공하면 번들이 갱신돼 age가 0으로 돌아가므로, jcloud가 죽어 있는 동안 약 3시간마다 한 번 돌아요
          if [ "$age" -ge 3 ]; then
            gh workflow run daily_crawl.yml --repo "$GITHUB_REPOSITORY" && echo "비상 수집 실행"
          fi

      # Supabase 무료 프로젝트는 7일간 활동이 없으면 일시정지돼요 → 매시 DB에 질의 1번
      - name: Supabase 깨워 두기
        run: |
          # 공개용(publishable) 키라 여기 적어도 돼요. 비로그인은 RLS로 막혀 401이지만 DB까지는 질의가 가요
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
            "https://eazksxmhtypedxaycrcg.supabase.co/rest/v1/user_saved?select=user_id&limit=1" \
            -H "apikey: sb_publishable_UJokd3NMOFJcfWjNjNSXPg_urs5q3kN")
          echo "Supabase 응답: $code"
          [ "$code" = 200 ] || [ "$code" = 401 ]
