name: Notion 포트폴리오 자동 동기화

on:
  workflow_dispatch: # GitHub Actions 웹에서 [Run workflow] 버튼으로 즉시 수동 실행 가능
  push:
    paths:
      - 'NOTION_PORTFOLIO_GUIDE.md'
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-notion:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Python 3.12 설정
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Notion 페이지로 포트폴리오 업로드 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python sync_to_notion.py
