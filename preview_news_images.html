<style>
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --surface-2: #E9EEF3;
  --ink: #0F2A44;
  --muted: #5B6C7E;
  --line: #D8E0E8;
  --accent: #D9480F;
  --accent-soft: #FFE8DB;
  --c-general: #5B6C7E;
  --c-road: #3F66A8;
  --c-water: #1F8585;
  --c-tunnel: #8B6440;
  --c-smart: #6A55C9;
  --ok: #2B8A3E;
  --r: 12px;
  --f-body: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 2px 8px rgba(15,42,68,.06), 0 1px 2px rgba(15,42,68,.04);
}

:root[data-theme="dark"] {
  --bg: #0A1521;
  --surface: #112131;
  --surface-2: #172B3F;
  --ink: #E4ECF4;
  --muted: #93A5B8;
  --line: #233850;
  --accent: #FF7A2E;
  --accent-soft: #3A2012;
  --c-general: #9AABBD;
  --c-road: #7FA3E0;
  --c-water: #4FC2C2;
  --c-tunnel: #C99C70;
  --c-smart: #A794F0;
  --ok: #69DB7C;
  --shadow: 0 2px 10px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  line-height: 1.55;
  padding-bottom: 60px;
  -webkit-font-smoothing: antialiased;
}

/* 상단 컨트롤 바 */
.top-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
  padding: 14px 20px;
}

.top-bar-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink);
}
.brand-badge {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--accent);
  color: #fff;
  font-weight: 600;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.seg-group {
  display: inline-flex;
  background: var(--surface-2);
  padding: 3px;
  border-radius: 8px;
  border: 1px solid var(--line);
}

.seg-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s ease;
  white-space: nowrap;
}
.seg-btn[aria-pressed="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
}
.seg-btn:hover:not([aria-pressed="true"]) {
  color: var(--ink);
}

.icon-toggle {
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  font-size: 13px;
  font-weight: 600;
  padding: 7px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* 메인 컨테이너 */
.container {
  max-width: 1200px;
  margin: 24px auto;
  padding: 0 20px;
}

/* 설명 배너 */
.info-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px 22px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.info-card h2 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.info-card p {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.6;
}
.info-pills {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.info-pill {
  font-size: 12px;
  padding: 3px 9px;
  border-radius: 6px;
  background: var(--surface-2);
  color: var(--ink);
  font-weight: 500;
}

/* 피드 그리드 (기본 2열 / 모바일 1열) */
.feed-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  transition: all .2s ease;
}

body.mode-mobile .feed-grid {
  max-width: 480px;
  margin: 0 auto;
  grid-template-columns: 1fr;
}

/* ==============================================================
   [타입 A: 상단 와이드 카드형 - Magazine Card Style] (권장)
   ============================================================== */
.type-a .news-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  transition: transform .15s ease, box-shadow .15s ease;
}
.type-a .news-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(15,42,68,.1);
}

.type-a .card-thumb-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--surface-2);
  overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.type-a .card-thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .3s ease;
}
.type-a .news-card:hover .card-thumb-wrap img {
  transform: scale(1.025);
}
.type-a .card-content {
  padding: 16px 18px 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 8px;
}
.type-a .card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12.5px;
  color: var(--muted);
}
.type-a .meta-left {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cat-tag {
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.cat-tag::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 2px;
  background: currentColor;
}
.type-a h3 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.45;
  color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.type-a .card-snippet {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.type-a .card-footer {
  margin-top: auto;
  padding-top: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ==============================================================
   [타입 B: 우측 썸네일 리스트형 - Editorial Row Style]
   ============================================================== */
.type-b .news-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.type-b .news-card:hover {
  transform: translateY(-2px);
}
.type-b .card-content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.type-b .card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}
.type-b h3 {
  font-size: 16px;
  font-weight: 700;
  line-height: 1.45;
  color: var(--ink);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.type-b .card-snippet {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.type-b .card-thumb-wrap {
  flex: none;
  width: 104px;
  height: 104px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.type-b .card-thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ==============================================================
   [타입 C: 1위 히어로 배너 + 그리드 복합형 - Lead Hero Style]
   ============================================================== */
.type-c .news-card.lead-hero {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
  box-shadow: var(--shadow);
}
@media (max-width: 768px) {
  .type-c .news-card.lead-hero {
    grid-template-columns: 1fr;
  }
}
.type-c .lead-hero .card-thumb-wrap {
  width: 100%;
  height: 100%;
  min-height: 240px;
  aspect-ratio: 16 / 9;
  background: var(--surface-2);
}
.type-c .lead-hero .card-thumb-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.type-c .lead-hero .card-content {
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
}
.type-c .lead-hero h3 {
  font-size: 21px;
  font-weight: 700;
  line-height: 1.4;
}
.type-c .lead-hero .card-snippet {
  font-size: 14.5px;
  color: var(--muted);
  line-height: 1.6;
}

/* ==============================================================
   [기존 방식: 텍스트 전용 카드 (Before)]
   ============================================================== */
.type-before .news-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: var(--shadow);
}
.type-before .card-thumb-wrap {
  display: none !important;
}
.type-before h3 {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.45;
}
.type-before .card-snippet {
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 버튼류 */
.cluster-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--muted);
  background: transparent;
  border: 1px dashed var(--line);
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
}
.cluster-btn:hover {
  color: var(--ink);
  border-color: var(--ink);
}

.save-btn {
  background: transparent;
  border: 0;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
  display: inline-flex;
  align-items: center;
}
.save-btn:hover {
  color: var(--accent);
}
.save-btn[aria-pressed="true"] {
  color: var(--accent);
}

/* 반응형 */
@media (max-width: 768px) {
  .feed-grid {
    grid-template-columns: 1fr;
  }
  .top-bar-inner {
    flex-direction: column;
    align-items: stretch;
  }
  .controls {
    justify-content: space-between;
  }
  .seg-btn {
    padding: 6px 9px;
    font-size: 12px;
  }
}
</style>

    image: "https://cdn.ebaekje.co.kr/news/photo/202610/209084_208977_4814.jpg",
    link: "https://cdn.ebaekje.co.kr/news/photo/202610/209084_208977_4814.jpg",
    related_count: 2
  }
];

const DESCRIPTIONS = {
  a: {
    title: "🌟 타입 A: 상단 와이드 카드형 (Magazine Card Style - 권장)",
    desc: "기사 상단에 시원한 16:9 와이드 포토가 노출되는 포털 헤드라인 카드 형태입니다. 공모전·채용 카드의 시각적 밸런스와 완벽히 일치하며, 토목 인프라 현장 전경(교량·댐·철도·터널)이 한눈에 전달되어 시각적 몰입감이 가장 높습니다.",
    pills: ["✨ 16:9 와이드 포토 썸네일", "📐 공모전/채용 카드와 규격 통일", "🖼️ 사진 없는 기사는 텍스트 전용으로 자연스러운 자동 전환"]
  },
  b: {
    title: "📰 타입 B: 우측 썸네일 리스트형 (Editorial Row Style)",
    desc: "네이버 뉴스/다음 뉴스 피드처럼 좌측에 텍스트, 우측에 104x104px 콤팩트 썸네일을 배치한 구조입니다. 한 화면에 많은 기사를 빠르게 스크롤하며 속독(Skimming)하기에 매우 적합합니다.",
    pills: ["⚡ 높은 정보 밀도", "📱 모바일 스크롤 최적화", "🗞️ 정통 신문/포털 뉴스 피드 느낌"]
  },
  c: {
    title: "🔥 타입 C: 1위 히어로 배너 + 그리드 복합형 (Lead Hero Style)",
    desc: "가장 화제가 된 오늘의 1위 톱 뉴스는 대형 와이드 히어로 포토로 전면 강조하고, 나머지 기사는 와이드 그리드로 배치하는 복합형 구조입니다. 매거진이나 전문지 메인 페이지와 같은 시각적 리듬감을 선사합니다.",
    pills: ["👑 1위 특종 기사 압도적 강조", "🎨 생동감 있는 페이지 레이아웃", "📈 주요 이슈 즉각 파악"]
  },
  before: {
    title: "📄 기존 방식: 텍스트 전용 카드 (Before)",
    desc: "사진 없이 텍스트(제목 + 2줄 요약)로만 구성되었던 기존 화면입니다. 간결하지만 시각적 차별점이 다소 부족하고 빽빽해 보일 수 있습니다.",
    pills: ["📋 텍스트 전용", "⚪ 여백 위주 레이아웃", "🔄 Before & After 비교용"]
  }
};

let currentMode = 'a';

function renderArticles() {
  const grid = document.getElementById('feedGrid');
  grid.className = `feed-grid type-${currentMode}`;

  grid.innerHTML = SAMPLE_ARTICLES.map((a, idx) => {
    const isLead = (currentMode === 'c' && idx === 0);
    const catVar = `var(--c-${a.category_id})`;

    const thumbHtml = (a.image && !a.is_curated_image) ? `
      <div class="card-thumb-wrap">
        <img src="${a.image}" alt="${a.title}" loading="lazy" referrerpolicy="no-referrer">
      </div>
    ` : `
      <div class="card-thumb-wrap thumb-co" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--surface-2) 0%,color-mix(in srgb,var(--surface-2) 75%,var(--line)) 100%);border-radius:8px;padding:8px;text-align:center;border:1px solid var(--line);">
        <span style="font-weight:700;font-size:13px;color:var(--muted);">${a.publisher}</span>
      </div>
    `;

    return `
      <article class="news-card ${isLead ? 'lead-hero' : ''}">
        ${thumbHtml}
        <div class="card-content">
          <div class="card-meta">
            <div class="meta-left">
              <span class="cat-tag" style="color: ${catVar}">${a.category_name}</span>
              <span>${a.publisher} · ${a.relative_date}</span>
            </div>
            <button class="save-btn" aria-label="기사 저장" aria-pressed="false" onclick="this.setAttribute('aria-pressed', this.getAttribute('aria-pressed')==='true'?'false':'true')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
            </button>
          </div>
          <a href="${a.link}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">
            <h3>${a.title}</h3>
          </a>
          <div class="card-footer">
            <span class="cluster-btn">관련 보도자료 ${a.related_count || 0}건 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
        </div>
      </article>
    `;
  }).join('');
}

// 탭 스위처
document.querySelectorAll('.seg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.seg-btn').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    currentMode = btn.dataset.mode;

    // 설명 업데이트
    const info = DESCRIPTIONS[currentMode];
    document.getElementById('modeTitle').textContent = info.title;
    document.getElementById('modeDesc').textContent = info.desc;
    const pillsWrap = document.querySelector('.info-pills');
    pillsWrap.innerHTML = info.pills.map(p => `<span class="info-pill">${p}</span>`).join('');

    renderArticles();
  });
});

// 모바일 / 데스크탑 뷰 전환
const viewBtn = document.getElementById('viewToggleBtn');
viewBtn.addEventListener('click', () => {
  const isMobile = document.body.classList.toggle('mode-mobile');
  viewBtn.textContent = isMobile ? '🖥️ 데스크탑 뷰' : '📱 모바일 뷰';
});

// 다크 모드 토글
const themeBtn = document.getElementById('themeToggleBtn');
themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  themeBtn.textContent = next === 'dark' ? '☀️ 라이트 모드' : '🌙 다크 모드';
});

renderArticles();
</script>
</body>
</html>
