# ==============================================================================
# Civil News Hub - Nginx Proxy Buffer & Timeout Tuning for JCloud VM
# 적용 대상: /etc/nginx/sites-available/default 또는 /etc/nginx/conf.d/*.conf
# ==============================================================================

# 1. Gemini AI 요약 및 챗봇 응답 타임아웃 (Gunicorn --timeout 90과 1:1 일치)
proxy_connect_timeout 90s;
proxy_send_timeout 90s;
proxy_read_timeout 90s;

# 2. 대용량 JSON 데이터 및 LLM 스트리밍 버퍼 최적화
# 수십~수백 KB 응답 시 디스크 임시 파일(/var/lib/nginx/proxy) 쓰기 방지 -> RAM에서 직접 처리
proxy_buffers 8 16k;
proxy_buffer_size 32k;
proxy_busy_buffers_size 64k;
proxy_temp_file_write_size 64k;

# 3. HTTP 프로토콜 버전 및 헤더 최적화
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
