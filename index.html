<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Civil News Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="./static/data_adapter.js?v=20261003_1327"></script>
<style>
/* Layout: plain solid ground, sticky header + tab nav, dashboard = main column + deadline rail; phones get a bottom tab bar and bottom-sheet drawer */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EEF3; --ink:#0F2A44; --muted:#5B6C7E; --line:#D8E0E8;
  --accent:#D9480F; --accent-soft:#FFE8DB; --shadow:0 1px 2px rgba(15,42,68,.06),0 8px 24px rgba(15,42,68,.06);
  --c-general:#5B6C7E; --c-road:#3F66A8; --c-water:#1F8585; --c-tunnel:#8B6440; --c-smart:#6A55C9;
  --ok:#2B8A3E; --warn:#E67700;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  /* type scale: minor third (1.2) from a 15px base, sized for a dense dashboard */
  --t-label:12px; --t-small:14px; --t-body:15px; --t-lead:17px; --t-h3:20px; --t-h2:24px; --t-h1:30px;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1521; --surface:#112131; --surface-2:#172B3F; --ink:#E4ECF4; --muted:#93A5B8; --line:#233850;
  --accent:#FF7A2E; --accent-soft:#3A2012; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --c-general:#9AABBD; --c-road:#7FA3E0; --c-water:#4FC2C2; --c-tunnel:#C99C70; --c-smart:#A794F0; --ok:#69DB7C; --warn:#FFA94D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1521; --surface:#112131; --surface-2:#172B3F; --ink:#E4ECF4; --muted:#93A5B8; --line:#233850;
  --accent:#FF7A2E; --accent-soft:#3A2012; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --c-general:#9AABBD; --c-road:#7FA3E0; --c-water:#4FC2C2; --c-tunnel:#C99C70; --c-smart:#A794F0; --ok:#69DB7C; --warn:#FFA94D;
  color-scheme:dark}

*{box-sizing:border-box}
/* 탭마다 페이지 길이가 달라도 화면이 좌우로 밀리지 않게 스크롤바를 늘 띄워 둬요 */
html{overflow-y:scroll;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--t-body);line-height:1.55;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;margin:0}
#ca .mono{font-family:var(--f-body);font-variant-numeric:tabular-nums}
#ca .wrap{max-width:1200px;margin:0 auto;padding-inline:20px}

/* header */
#ca header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#ca .top-row{display:flex;align-items:center;gap:20px;height:60px}
#ca .logo{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
#ca .logo b{font-family:var(--f-body);font-size:var(--t-small);background:var(--ink);color:var(--bg);padding:3px 6px;border-radius:4px}
#ca .logo span{font-size:var(--t-lead)}
#ca nav.tabs{display:flex;gap:4px;flex:1}
#ca nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
#ca nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
#ca nav.tabs .jb{font-size:var(--t-label);font-weight:700;color:var(--accent);margin-left:4px;vertical-align:2px}
#ca .icon-btn{background:none;border:1px solid var(--line);width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
#ca .icon-btn svg{width:18px;height:18px}
#ca .search{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;height:36px;width:220px;color:var(--muted)}
#ca .search input{border:0;background:none;outline:none;font:inherit;font-size:var(--t-small);color:var(--ink);width:100%;min-width:0}
#ca .search svg{width:16px;height:16px;flex:none}
/* clear button takes the magnifier slot on the left once there is a search term */
#ca .q-clear{border:0;background:var(--surface-2);color:var(--muted);width:22px;height:22px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
#ca .q-clear:hover{background:var(--ink);color:var(--bg)}
#ca .q-clear svg{width:12px;height:12px}
#ca .search.has-q .q-icon{display:none}
#ca .tag[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#ca .tag[aria-pressed="true"] .rk,#ca .tag[aria-pressed="true"] .up{color:inherit}

/* ticker */
#ca .ticker{display:flex;align-items:center;gap:12px;height:44px;overflow:hidden}
#ca .ticker-label{font-size:var(--t-label);font-weight:700;letter-spacing:.08em;color:var(--accent);white-space:nowrap;display:flex;align-items:center;gap:6px}
#ca .ticker-label i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.6s infinite}
#ca .tags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
#ca .tags::-webkit-scrollbar{display:none}
#ca .tag{white-space:nowrap;border:1px solid var(--line);background:var(--surface);padding:4px 10px;border-radius:999px;font-size:var(--t-small);display:flex;gap:6px;align-items:center}
#ca .tag .rk{font-family:var(--f-body);font-size:var(--t-label);color:var(--muted)}
#ca .tag .up{font-size:var(--t-label);color:var(--accent)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

#ca .notice{font-size:var(--t-small);color:var(--muted);padding-block:10px 0}

#ca main{padding-block:20px 100px}
#ca .view[hidden]{display:none}
#ca .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
#ca .sec-head h2{font-size:var(--t-lead);font-weight:700}
#ca .sec-head .more{background:none;border:0;color:var(--muted);font-size:var(--t-small);padding:0}
#ca .sec-head .more:hover{color:var(--accent)}
#ca .eyebrow{font-size:var(--t-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* home */
#ca .home-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
#ca .home-main{display:flex;flex-direction:column;gap:32px;min-width:0}
#ca .rail{position:sticky;top:120px;display:flex;flex-direction:column;gap:16px}
#ca .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

#ca .briefing{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
#ca .briefing .news.lead h3{font-size:var(--t-h3);line-height:1.4}
#ca .side-news{display:flex;flex-direction:column;gap:12px}
#ca .side-news .news{padding:14px}
#ca .side-news .news .lede,#ca .side-news .news .cluster-wrap{display:none}
#ca .briefing .news .cluster-wrap{margin-top:auto}

/* news */
#ca .news{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
#ca .news-meta{display:flex;gap:10px;align-items:center;font-size:var(--t-small);color:var(--muted);flex-wrap:wrap}
#ca .cat{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--cat)}
#ca .cat::before{content:"";width:8px;height:8px;background:var(--cat);border-radius:2px}
#ca .news h3{font-size:var(--t-lead);line-height:1.45;font-weight:700;letter-spacing:-.01em;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#ca .lede{margin:0;font-size:var(--t-small);color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:var(--lede-lines,2);-webkit-box-orient:vertical;overflow:hidden}
#ca .cluster-btn{align-self:flex-start;background:none;border:1px dashed var(--line);border-radius:6px;padding:5px 10px;font-size:var(--t-small);color:var(--muted);display:flex;align-items:center;gap:6px}
#ca .cluster-btn:hover{border-color:var(--ink);color:var(--ink)}
#ca .cluster-btn .n{font-family:var(--f-body);font-weight:700;color:var(--ink)}
#ca .cluster-btn svg{width:14px;height:14px;transition:transform .2s}
#ca .cluster-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
/* related outlets float above the button as a popover, so opening it never pushes the page around */
#ca .cluster-wrap{position:relative}
#ca .cluster{position:absolute;left:0;bottom:calc(100% + 8px);z-index:25;width:max-content;max-width:min(340px,calc(100vw - 48px));margin:0;padding:10px;list-style:none;display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
#ca .cluster li{font-size:var(--t-small);font-weight:500;padding:0;border-radius:6px;background:var(--surface-2);white-space:nowrap;transition:all .15s}
#ca .cluster li:hover{background:var(--ink);color:var(--bg)}
#ca .cluster li a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:4px;padding:4px 9px}

#ca .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
#ca .chips{display:flex;gap:6px;flex-wrap:wrap}
#ca .chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:var(--t-small);font-weight:500;display:flex;align-items:center;gap:6px}
#ca .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#ca .chip .dot{width:8px;height:8px;border-radius:2px;background:var(--cat)}
#ca .spacer{flex:1}
#ca .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
#ca .seg button{border:0;background:none;padding:6px 12px;font-size:var(--t-small);color:var(--muted)}
#ca .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:600}
#ca select{font:inherit;font-size:var(--t-small);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px}

#ca .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
#ca .news-grid.list{grid-template-columns:1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
#ca .news-grid.list .news:first-child{border-radius:var(--r) var(--r) 0 0}
#ca .news-grid.list .news:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:0}
#ca .news-grid.list .news{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px;gap:6px}
#ca .news-grid.list .news .lede{display:none}
#ca .news-grid.list .news h3{font-size:var(--t-lead)}
/* card view: cards in a row stretch to the same height, so the related-articles button sits on one line at the bottom */
#ca .news-grid:not(.list) .news .cluster-wrap{margin-top:auto}
/* title + excerpt always fill four lines: a 1-line title gets a 3-line excerpt (line count set by fitNewsLines) */
#ca .news-grid:not(.list) .news .lede,#ca .briefing .news.lead .lede{-webkit-line-clamp:var(--lede-lines,2)}

/* d-day */
#ca .dday{font-family:var(--f-body);font-weight:700;font-size:var(--t-small);padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#ca .dday.soon{border:1px solid var(--accent);color:var(--accent);background:transparent}
#ca .dday.hot{background:var(--accent);color:#fff;animation:pulse 1.8s infinite}
@media (prefers-reduced-motion:reduce){#ca .dday.hot,#ca .ticker-label i{animation:none}}

/* contest */
#ca .counter{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
#ca .counter strong{font-family:var(--f-body);font-size:var(--t-h2);color:var(--accent)}
#ca .counter span{color:var(--muted);font-size:var(--t-small)}
#ca .contest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
#ca .h-scroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,280px);gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
#ca .h-scroll>*{scroll-snap-align:start}
#ca .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;transition:border-color .15s,transform .15s;min-width:0}
#ca .card.click{cursor:pointer}
@media (hover:hover){#ca .card.click:hover{border-color:var(--ink);transform:translateY(-2px)}}
#ca .card.click:active{border-color:var(--ink)}
#ca .m-only{display:none}
#ca .sort{display:flex;align-items:center;gap:8px}
#ca .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#ca .prize{font-family:var(--f-body);font-weight:700;font-size:var(--t-h3);letter-spacing:-.02em}
#ca .prize small{font-family:var(--f-body);font-size:var(--t-small);color:var(--muted);font-weight:500;margin-left:4px}
#ca .card h3{font-size:var(--t-body);line-height:1.45;font-weight:600}
#ca .card.title-first h3{font-size:var(--t-lead);font-weight:700;line-height:1.4;letter-spacing:-.01em}
#ca .prize-line{font-size:var(--t-small);color:var(--muted)}
#ca .prize-line b{color:var(--ink);font-weight:700}
#ca .pills{display:flex;gap:5px;flex-wrap:wrap}
#ca .pill{font-size:var(--t-label);padding:2px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted);font-weight:500}
#ca .pill.award{background:var(--accent-soft);color:var(--accent);font-weight:600}
#ca .pill.new{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-weight:600}
#ca .pill.exp{background:color-mix(in srgb,var(--c-road) 15%,transparent);color:var(--c-road);font-weight:600}
#ca .meta{font-size:var(--t-small);color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
#ca .bm{background:none;border:0;padding:4px;color:var(--muted);display:grid;place-items:center;border-radius:6px}
#ca .bm svg{width:18px;height:18px}
#ca .bm[aria-pressed="true"]{color:var(--accent)}
#ca .bm[aria-pressed="true"] svg{fill:currentColor}
#ca .news-meta .bm{margin-left:auto}
#ca .card-top-r{display:flex;align-items:center;gap:4px}
#ca [data-item].flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
/* saved items: header button with count, list opens in the side drawer */
#ca .saved-btn{position:relative}
#ca .saved-btn .count{position:absolute;top:-7px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font-size:var(--t-label);font-weight:700;display:grid;place-items:center;line-height:1}
#ca .saved-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
#ca .saved-list li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
#ca .saved-row{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:2px}
#ca .saved-kind{font-size:var(--t-label);font-weight:700;color:var(--k)}
#ca .saved-t{font-weight:600;line-height:1.4}
#ca .saved-sub{font-size:var(--t-small);color:var(--muted)}
#ca .saved-row:hover .saved-t{text-decoration:underline}
#ca .saved-empty{margin:0;color:var(--muted);font-size:var(--t-small)}
#ca .back{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--muted);font-size:var(--t-small);font-weight:600}
#ca .back:hover{color:var(--ink)}

/* jobs */
#ca .job-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
#ca .co{display:flex;align-items:center;gap:10px;min-width:0}
#ca .logo-mark{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:var(--t-body)}
#ca .co-name{font-weight:600;font-size:var(--t-small)}
#ca .co-type{font-size:var(--t-small);color:var(--muted)}
#ca .steps{display:flex;align-items:center;gap:0;font-size:var(--t-label);overflow-x:auto}
#ca .step{display:flex;align-items:center;gap:0;white-space:nowrap;color:var(--muted)}
#ca .step b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-body);font-size:var(--t-label);margin-right:5px;background:var(--surface)}
#ca .step.ncs b{border-color:var(--accent);color:var(--accent)}
#ca .step+.step::before{content:"";width:14px;height:1.5px;background:var(--line);margin:0 6px}

/* rail timeline */
#ca .tl{list-style:none;margin:0;padding:0;position:relative}
#ca .tl::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1.5px;background:var(--line)}
#ca .tl li{position:relative;padding:8px 0 8px 22px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
#ca .tl li::before{content:"";position:absolute;left:0;top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--kind)}
#ca .tl .tl-body{flex:1;min-width:0}
#ca .tl .kind{font-size:var(--t-label);font-weight:700;color:var(--kind);letter-spacing:.04em}
#ca .tl .t{font-size:var(--t-small);font-weight:500;line-height:1.4}
#ca .tl li:hover .t{text-decoration:underline}
#ca .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#ca .stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
#ca .stat .v{font-family:var(--f-body);font-size:var(--t-h3);font-weight:700}
#ca .stat .l{font-size:var(--t-small);color:var(--muted)}

/* jbnu */
#ca .jb-hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
#ca .jb-hero h2{font-size:var(--t-h3)}
#ca .jb-hero p{margin:4px 0 0;color:var(--muted);font-size:var(--t-small)}
#ca .alba-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:36px}
#ca .income{font-family:var(--f-body);font-size:var(--t-h2);font-weight:700;color:var(--ok);letter-spacing:-.02em}
#ca .income-l{font-size:var(--t-small);color:var(--muted)}
#ca .wage-row{display:flex;gap:14px;font-size:var(--t-small);color:var(--muted)}
#ca .wage-row b{color:var(--ink);font-family:var(--f-body);font-weight:500}

/* drawer */
#ca .scrim{position:fixed;inset:0;background:rgba(5,15,25,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#ca .scrim.on{opacity:1;pointer-events:auto}
#ca .drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#ca .drawer.on{transform:none}
#ca .drawer-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
#ca .drawer-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
#ca .drawer-body h2{font-size:var(--t-h3);line-height:1.4}
#ca dl.spec{display:grid;grid-template-columns:88px 1fr;gap:10px 12px;margin:0;font-size:var(--t-small)}
#ca dl.spec dt{color:var(--muted)}
#ca dl.spec dd{margin:0;font-weight:500}
#ca .cta{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px;font-weight:600;font-size:var(--t-body)}
#ca .cta.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
#ca .row{display:flex;gap:10px}
#ca .row>*{flex:1}

<script>
/* ---------- 공용 북마크: 두 화면이 같은 목록을 쓰고, 로그인한 사람은 기기 사이에서도 동기화돼요 ---------- */
const saved = new Set();
const savedListeners = [];
try { JSON.parse(localStorage.getItem('cnh-saved') || '[]').forEach(id => saved.add(id)); } catch(e){}
let savedRef = null, savedWriteT = null, savedWriting = false, savedAgain = false;
function storeSavedLocal(){ try { localStorage.setItem('cnh-saved', JSON.stringify([...saved])); } catch(e){} }
function notifySaved(){ savedListeners.forEach(f => { try { f(); } catch(e){} }); }
async function writeSavedRemote(){
  if (!savedRef) return;
  if (savedWriting){ savedAgain = true; return; }
  savedWriting = true;
  try { await savedRef.set({ids: [...saved]}); }
  catch(e){ if (!e || e.code !== 'unavailable') savedRef = null; }
  savedWriting = false;
  if (savedAgain){ savedAgain = false; writeSavedRemote(); }
}
function persistSaved(){
  storeSavedLocal(); notifySaved();
  clearTimeout(savedWriteT); savedWriteT = setTimeout(writeSavedRemote, 300);
}
(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id();
  if (!uid) return;
  const ref = db.doc('data/users/' + uid + '/saved');
  let first = true;
  ref.onSnapshot(snap => {
    const body = snap.exists ? snap.data() : null;
    const remote = body && Array.isArray(body.ids) ? body.ids : [];
    if (first){
      // 처음 연결할 때는 이 브라우저에 있던 북마크와 합쳐요
      first = false; savedRef = ref;
      const before = saved.size;
      remote.forEach(id => saved.add(id));
      const needsWrite = saved.size !== remote.length;
      if (saved.size !== before){ storeSavedLocal(); notifySaved(); }
      if (needsWrite) writeSavedRemote();
      return;
    }
    if (snap.metadata.hasPendingWrites) return;
    if (remote.length === saved.size && remote.every(id => saved.has(id))) return;
    saved.clear(); remote.forEach(id => saved.add(id));
    storeSavedLocal(); notifySaved();
  }, () => { savedRef = null; });
})();
</script>

function monthly(a){
  if (a.type === 'day') return a.wage * a.days;
  const weekly = a.wage * a.hours + (a.hours >= 15 ? a.wage * a.hours / 5 : 0);
  return Math.round(weekly * 4.345 / 100) * 100;
}
function toggleSave(id, btn){
  saved.has(id) ? saved.delete(id) : saved.add(id);
  persistSaved();
  document.querySelectorAll(`[data-bm="${id}"]`).forEach(b => b.setAttribute('aria-pressed', saved.has(id)));
  toast(saved.has(id) ? '저장했어요. 오른쪽 위 북마크 버튼에서 모아 볼 수 있어요.' : '저장을 취소했어요.');
  updateSavedCount();
  if (drawerMode === 'saved') openSaved();
}

    cluster = n.clusters.map(c => `<li><a href="${c.link || '#'}" target="_blank" rel="noopener noreferrer" title="${(c.title || '').replace(/"/g, '&quot;')} (기사 원문 열기)"><span>${c.publisher}</span><span style="font-size:10px;opacity:0.65">↗</span></a></li>`).join('');
  } else if (n.n > 0) {
    cluster = Array.from({length:n.n}, (_,k) => `<li>${OTHER_SRC[(i+k)%OTHER_SRC.length]}</li>`).join('');
  }
  return `<article class="news" data-item="${n.id}" style="--cat:var(--c-${n.cat})">
    <div class="news-meta"><span class="cat">${catName(n.cat)}</span><span>${n.src} · ${n.ago}</span>${bmBtn(n.id)}</div>
    <a href="${n.link || '#'}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit"><h3 style="cursor:pointer" title="원문 기사 새 창 열기">${n.title}</h3></a>
    <p class="lede">${n.lede}</p>

      <button class="cluster-btn" aria-expanded="false">같은 보도자료 기사 <span class="n">${n.n}</span>건 ${ICON.chev}</button>
      <ul class="cluster" aria-label="같은 보도자료로 기사를 쓴 언론사" hidden>${cluster}</ul>
    </div>` : ''}
  </article>`;
}

// 제목 줄 수를 재서 본문 줄 수를 정해요 (제목 + 본문 = 4줄). 화면에 보일 때만 잴 수 있어요.
function fitNewsLines(){
  const isNewsHidden = !$('#v-news') || $('#v-news').hidden;
  const isHomeHidden = !$('#v-home') || $('#v-home').hidden;
  if (isNewsHidden && isHomeHidden) return;

  const cards = document.querySelectorAll('#ca .news-grid:not(.list) .news, #ca .briefing .news.lead');
  cards.forEach(c => {
    const h = c.querySelector('h3'), lede = c.querySelector('.lede');
    if (!h || !lede) return;
    
    const hHeight = h.getBoundingClientRect().height || h.offsetHeight || 0;
    if (hHeight <= 0) return;

    const style = getComputedStyle(h);
    let lh = parseFloat(style.lineHeight);
    if (isNaN(lh) || lh <= 0) {
      const fs = parseFloat(style.fontSize) || 16;
      lh = fs * 1.45;
    }
    
    // 제목 줄 수 (최소 1줄, 최대 2줄 제한)
    const lines = Math.min(2, Math.max(1, Math.round(hHeight / lh)));
    // 제목이 1줄이면 본문 3줄, 제목이 2줄이면 본문 2줄 (합산 항상 정확히 4줄)
    const ledeLines = Math.max(1, 4 - lines);
    lede.style.setProperty('--lede-lines', ledeLines);
  });
}

  const cb = e.target.closest('.cluster-btn');
  if (cb){ const open = cb.getAttribute('aria-expanded')==='true'; closeClusters(); if (!open){ cb.setAttribute('aria-expanded','true'); cb.nextElementSibling.hidden = false; } return; }
  const g = e.target.closest('[data-go]'); if (g){ go(g.dataset.go); if (g.dataset.focus){ closeDrawer(); focusItem(g.dataset.focus); } return; }
  const sv = e.target.closest('[data-saved]'); if (sv){ openSaved(); return; }

  const t = e.target.closest('[data-target]'); if (t){ target=t.dataset.target; renderContests(); return; }

async function syncDesktopLiveData(){
  if (typeof CivilData === 'undefined') return;
  try {
    const live = await CivilData.loadAll();
    if (live) {
      if (live.TRENDS && live.TRENDS.length) TRENDS = live.TRENDS;
      if (live.NEWS && live.NEWS.length) NEWS = live.NEWS;
      if (live.CONTESTS && live.CONTESTS.length) CONTESTS = live.CONTESTS;
      if (live.JOBS && live.JOBS.length) JOBS = live.JOBS;
      if (live.ALBA && live.ALBA.length) ALBA = live.ALBA;
      if (live.SW && live.SW.length) SW = live.SW;

      const tEl = $('#trend');
      if (tEl) {
        tEl.innerHTML = TRENDS.map(([t,up],i)=>`<button class="tag" data-trend="${t}" aria-pressed="false"><span class="rk">${i+1}</span>#${t}${up?'<span class="up">▲</span>':''}</button>`).join('');
      }

      renderHome();
      renderNews();
      renderContests();
      renderJobs();
      renderJbnu();
      updateSavedCount();

      const notEl = $('#live-notice');
      if (notEl && live.meta) {
        notEl.innerHTML = `🟢 <b>실시간 자동 수집 데이터 연동 완료</b> (토목 뉴스 <strong>${live.meta.newsCount}</strong>건, 채용 <strong>${live.meta.jobsCount}</strong>건, 공모전 <strong>${live.meta.contestsCount}</strong>건, 전북대 알바 <strong>${live.meta.albaCount}</strong>건 · 업데이트: ${live.meta.lastUpdated})`;
      }
    }
  } catch(e) {
    console.warn('Desktop live sync error:', e);
  }
}
syncDesktopLiveData();

function monthly(a){
  if (a.type === 'day') return a.wage * a.days;
  const weekly = a.wage * a.hours + (a.hours >= 15 ? a.wage * a.hours / 5 : 0);
  return Math.round(weekly * 4.345 / 100) * 100;
}

function render(toTop = true){
  $('#m-view').innerHTML = VIEWS[tab]();

  document.querySelectorAll('.tabbar [data-go]').forEach(b=> b.dataset.go===tab ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current'));
  if (toTop) window.scrollTo({top:0});
  onScroll();
  requestAnimationFrame(() => { fitMobileNewsLines(); requestAnimationFrame(fitMobileNewsLines); });
}
function fitMobileNewsLines(){
  document.querySelectorAll('#m-view .row').forEach(r => {
    const t = r.querySelector('.row-title'), lede = r.querySelector('.row-sub.lede');
    if (!t || !lede) return;
    const h = t.getBoundingClientRect().height || t.offsetHeight || 0;
    if (h <= 0) return;
    const style = getComputedStyle(t);
    let lh = parseFloat(style.lineHeight);
    if (isNaN(lh) || lh <= 0) lh = (parseFloat(style.fontSize) || 15) * 1.45;
    const lines = Math.min(2, Math.max(1, Math.round(h / lh)));
    lede.style.setProperty('--m-lede-lines', Math.max(1, 4 - lines));
  });
}
function go(t){
  if (!VIEWS[t]) t = 'home';
  tab = t;
  if (location.hash.slice(1) !== t) history.replaceState(null,'','#'+t);
  render();
}
function rerender(){ const y = scrollY; render(false); window.scrollTo({top:y}); }

        <div><dt>시상</dt><dd>대상 1팀, 최우수 2팀, 우수 3팀, 장려 5팀</dd></div>
        <div><dt>제출물</dt><dd>기획서(PDF, 10쪽 이내), 발표 영상 3분</dd></div>
      </dl>`;
    foot = `<button class="btn ghost" data-save="${c.id}" aria-pressed="${saved.has(c.id)}">${saved.has(c.id)?'저장됨':'저장'}</button><a href="${c.link || '#'}" target="_blank" rel="noopener noreferrer" class="btn" style="text-decoration:none;display:grid;place-items:center">공식 접수처 바로가기 ↗</a>`;
  } else {
    const j = JOBS.find(x=>x.id===id);
    kind = GRP[j.grp] + ' 채용';
    body = `<div style="display:flex;gap:14px;align-items:center"><div class="logo" style="background:${j.color}">${j.co[0]}</div><div><div class="row-meta"><span>${j.co}</span></div><h2 id="sh-title">${j.role}</h2></div></div>
      <dl class="spec">
        <div><dt>지원 자격</dt><dd>${j.lvl}${j.exp?' ('+j.exp+')':''}, 토목 관련 전공</dd></div>
        <div><dt>근무지</dt><dd>${j.loc}</dd></div>
        <div><dt>마감</dt><dd><span class="num">${md(day(j.end))} 18:00</span> ${ddPill(j.end)}</dd></div>
        <div><dt>우대</dt><dd>토목기사, 건설안전기사, BIM 활용 경험</dd></div>
      </dl>
      <div><div class="sub-h">전형 절차</div><ol class="steps">${j.steps.map(s=>`<li class="${s==='NCS'?'ncs':''}">${s}</li>`).join('')}</ol></div>
      <div><div class="sub-h">복리후생</div><div class="pills">${j.welfare.map(w=>`<span class="pill">${w}</span>`).join('')}</div></div>`;
    foot = `<button class="btn ghost" data-save="${j.id}" aria-pressed="${saved.has(j.id)}">${saved.has(j.id)?'저장됨':'저장'}</button><a href="${j.link || '#'}" target="_blank" rel="noopener noreferrer" class="btn" style="text-decoration:none;display:grid;place-items:center">채용 공고 지원하기 ↗</a>`;
  }
  $('#m-sh-kind').textContent = kind; $('#m-sh-body').innerHTML = body; $('#m-sh-foot').innerHTML = foot;
  $('#m-sh-body').scrollTop = 0;
  lastFocus = document.activeElement;
  $('#m-sheet').classList.add('on'); $('#m-scrim').classList.add('on');
  $('#m-sh-close').focus({preventScroll:true});
}
function closeSheet(){
  const s = $('#m-sheet'); s.style.transform = ''; s.classList.remove('on'); $('#m-scrim').classList.remove('on');
  lastFocus && lastFocus.focus && lastFocus.focus({preventScroll:true});
}
// 손잡이를 아래로 끌어 닫기
let y0 = null;
$('#m-grab').addEventListener('touchstart', e=>{ y0 = e.touches[0].clientY; $('#m-sheet').style.transition = 'none'; }, {passive:true});
$('#m-grab').addEventListener('touchmove', e=>{ if (y0===null) return; const dy = Math.max(0, e.touches[0].clientY - y0); $('#m-sheet').style.transform = `translate(-50%,${dy}px)`; }, {passive:true});
$('#m-grab').addEventListener('touchend', e=>{
  if (y0===null) return; const dy = e.changedTouches[0].clientY - y0; y0 = null;
  const s = $('#m-sheet'); s.style.transition = '';
  if (dy > 90) closeSheet(); else s.style.transform = '';
});

/* ---------- 검색 ---------- */
function openSearch(q = ''){
  $('#m-search').hidden = false; $('#m-q').value = q; runSearch(); $('#m-q').focus();
  document.body.style.overflow = 'hidden';
}
function closeSearch(){ $('#m-search').hidden = true; document.body.style.overflow = ''; }
function runSearch(){
  const q = $('#m-q').value.trim().toLowerCase();
  const el = $('#m-search-res');
  if (!q){
    el.innerHTML = `<div class="sec-h"><h2>많이 찾는 키워드</h2></div><div class="chips wrap">${TRENDS.map(t=>`<button class="chip" data-q="${t}">#${t}</button>`).join('')}</div>`;
    return;
  }
  const has = s => s.toLowerCase().includes(q);
  const groups = [
    ['뉴스', NEWS.map((n,i)=>[n,i]).filter(([n])=>has(n.title)||has(n.lede)).map(([n,i])=>newsRow(n,i))],
    ['공모전', CONTESTS.filter(c=>has(c.title)||has(c.org)).map(contestRow)],
    ['채용', JOBS.filter(j=>has(j.co)||has(j.role)).map(jobRow)],
    ['전북대 알바', ALBA.filter(a=>has(a.title)||has(a.where)).map(albaRow)],
  ].filter(g=>g[1].length);
  el.innerHTML = groups.length
    ? groups.map(([t,rows])=>`<section class="sec"><div class="sec-h"><h2>${t}<small>${rows.length}</small></h2></div>${list(rows.join(''))}</section>`).join('')
    : `<p class="empty" style="margin-top:12px">'${$('#m-q').value.trim()}'와 맞는 항목이 없어요. 더 짧은 단어로 찾아 보세요.</p>`;
}
$('#m-q').addEventListener('input', runSearch);

/* ---------- 이벤트 ---------- */
let tt;
function toast(msg){ const t = $('#m-toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove('on'), 2400); }

document.addEventListener('click', e=>{
  if (!e.target.closest('#m')) return;
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.save) return toggleSave(d.save);
  if ('dummy' in d) return toast('예시 데이터라서 실제 페이지로 연결되지 않아요.');
  if (d.open) return openSheet(d.open);
  if (d.go){ closeSearch(); return go(d.go); }
  if (d.q) return openSearch(d.q);
  if (d.cat){ newsCat = d.cat; return rerender(); }
  if (d.tg){ target = d.tg; return rerender(); }
  if (d.sort){ sortBy = d.sort; return rerender(); }
  if (d.grp){ jobGrp = d.grp; return rerender(); }
  if (d.lvl){ lvl = d.lvl; return rerender(); }
});
$('#m-scrim').onclick = closeSheet;
$('#m-sh-close').onclick = closeSheet;
$('#m-open-search').onclick = () => openSearch();
$('#m-close-search').onclick = closeSearch;
document.addEventListener('keydown', e=>{
  if (e.key !== 'Escape' || document.getElementById('m').hidden) return;
  if ($('#m-sheet').classList.contains('on')) closeSheet(); else if (!$('#m-search').hidden) closeSearch();
});
function onScroll(){ $('#m-bar').classList.toggle('scrolled', scrollY > 44); }
addEventListener('scroll', onScroll, {passive:true});

$('#m-theme').onclick = ()=>{
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('cnh-theme', r.dataset.theme); } catch(e){}
};
try { const th = localStorage.getItem('cnh-theme'); if (th) document.documentElement.dataset.theme = th; } catch(e){}

// 다른 화면이나 다른 기기에서 북마크가 바뀌면 저장 버튼과 오늘 탭을 다시 그려요
savedListeners.push(()=>{
  document.querySelectorAll('#m [data-save]').forEach(b=>{ const on = saved.has(b.dataset.save); b.setAttribute('aria-pressed', on); if (!b.classList.contains('save-i')) b.textContent = on ? '저장됨' : '저장'; });
  if (tab === 'home' && !document.getElementById('m').hidden) render(false);
});
go(location.hash.slice(1) || 'home');

/* ---------- 모바일 실시간 크롤링 데이터 연동 엔진 ---------- */
async function syncMobileLiveData(){
  if (typeof CivilData === 'undefined') return;
  try {
    const live = await CivilData.loadAll();
    if (live) {
      if (live.TRENDS && live.TRENDS.length) TRENDS = live.TRENDS.map(t=>t[0]);
      if (live.NEWS && live.NEWS.length) NEWS = live.NEWS;
      if (live.CONTESTS && live.CONTESTS.length) CONTESTS = live.CONTESTS;
      if (live.JOBS && live.JOBS.length) JOBS = live.JOBS;
      if (live.ALBA && live.ALBA.length) ALBA = live.ALBA;
      if (live.SW && live.SW.length) SW = live.SW;

      if (typeof rerender === 'function') rerender();
      else if (typeof render === 'function') render(false);

      const mNotEl = $('#m-live-notice');
      if (mNotEl && live.meta) {
        mNotEl.innerHTML = `🟢 <b>실시간 크롤링 데이터</b> (뉴스 ${live.meta.newsCount}건, 채용 ${live.meta.jobsCount}건, 공모전 ${live.meta.contestsCount}건, 알바 ${live.meta.albaCount}건 · 업데이트: ${live.meta.lastUpdated})`;
      }
    }
  } catch(e) {
    console.warn('Mobile live sync error:', e);
  }
}
syncMobileLiveData();

})();
</script>
<script>
/* ---------- 화면 고르기: 스마트폰이면 모바일 화면(#m), 태블릿/아이패드/PC는 데스크톱 화면(#ca) ---------- */
(() => {
  const ca = document.getElementById('ca'), m = document.getElementById('m');

  function isPhoneDevice() {
    const ua = navigator.userAgent || '';
    // 1. 아이패드(iPad) 제외: iPadOS(MacIntel + multi-touch) 또는 iPad UA -> 데스크톱 사이트
    const isIPad = /iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIPad) return false;

    // 2. 안드로이드 태블릿(Galaxy Tab 등) 제외: Android 포함 + Mobile 단어 없음 -> 데스크톱 사이트
    const isAndroidTablet = /Android/i.test(ua) && !/Mobile/i.test(ua);
    if (isAndroidTablet) return false;

    // 3. 스마트폰(iPhone, 일반 Android 스마트폰) 감지 -> 모바일 전용 뷰
    const isMobilePhone = /iPhone|iPod/i.test(ua) || (/Android/i.test(ua) && /Mobile/i.test(ua)) || /BlackBerry|IEMobile|Opera Mini/i.test(ua);
    if (isMobilePhone) return true;

    // 4. 일반 PC 브라우저 창 크기가 600px 이하로 줄어들었을 때만 반응형 모바일 뷰
    return window.innerWidth <= 600;
  }

  // 예전 전환 버튼으로 저장해 둔 선택이 남아 있으면 지워서 자동 감지만 적용
  try { localStorage.removeItem('cnh-layout'); } catch(e){}

  function apply(){
    const mobile = isPhoneDevice();
    if (ca.hidden === mobile && m.hidden === !mobile) return;
    if (mobile && typeof closeDrawer === 'function') closeDrawer();
    ca.hidden = mobile; m.hidden = !mobile;
    notifySaved();
    if (!mobile && typeof fitNewsLines === 'function') fitNewsLines();
    window.scrollTo(0, 0);
  }

  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', apply);
  apply();
})();
</script>
